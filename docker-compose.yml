version: '3.9'

services:
  acs:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/colawebrunner/docker-acs:latest
    environment:
      # Read from a local .env file (git-ignored) or the calling shell.
      # Needs a token with `repo` scope to reach the private Maintel-ICON repos.
      - GITHUB_PAT=${GITHUB_PAT:-}
    volumes:
      - ./:/code/
